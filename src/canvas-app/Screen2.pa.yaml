Screens:
  Screen2:
    Properties:
      Fill: =Cor.BackgroundStandard
      LoadingSpinnerColor: =Cor.Primary
    Children:
      - html_9box_1:
          Control: HtmlViewer@2.1.0
          Properties:
            Color: =Cor.TextStandard
            DisabledBorderColor: =Cor.Disabled
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =619
            HtmlText: "=With({\n\n    //Régua Notas (as notas são de 1 a ?\"\n    NotaMaxima:3,\n    \n    //Dimensões\n    Largura:\"600px\",\n    Altura:\"600px\",\n    \n    //Eixos X e Y\n    CorTexto:\"black\",\n    CorFundo:\"transparente\",\n    LinhaCor:\"black\",\n    LinhaEspessura:\"2px\",\n    LinhaTipo:\"solid\",\n\n\n    //LEGENDAS EIXOS\n    TextoEixoX:\"DESEMPENHO\",\n    TextoEixoY:\"POTENCIAL\",\n\n    //LEGENDAS QUADRANTES\n    X1:\"1\",\n    X2:\"2\",\n    X3:\"3\",\n    Y1:\"1\",\n    Y2:\"2\",\n    Y3:\"3\",\n\n    //QUADRANTES\n    //Linha 1\n    X1Y1:{Texto:\"Função exige mais que suas habilidades. Analisar demissão ou cargo de menor responsabilidade\", CorFundo:\"#f8d4d1\", CorTexto:\"black\"},\n    X1Y2:{Texto:\"Testar novas atribuições. Pode estar desmotivado\", CorFundo:\"#fde2c6\", CorTexto:\"black\"},\n    X1Y3:{Texto:\"Está bem na função. Verificar remuneração e manter cargo atual.\", CorFundo:\"#ffffd1\", CorTexto:\"black\"},\n    \n    //Linha 2\n    X2Y1:{Texto:\"Pode estar na área errada. Testar novas atribuiçoes.\", CorFundo:\"#fde2c6\", CorTexto:\"black\"},\n    X2Y2:{Texto:\"Está bem na função atual. Investir em capacitação para aumentar o desempenho.\", CorFundo:\"#ffffd1\", CorTexto:\"black\"},\n    X2Y3:{Texto:\"Tem potencial de liderança. Analisar possibilidade de pequenas promoções internas.\", CorFundo:\"#c6f0d1\", CorTexto:\"black\"},\n    \n    //Linha 3\n    X3Y1:{Texto:\"Tem potencial mas, pode estar mal aproveitado na área.\", CorFundo:\"#ffffd1\", CorTexto:\"black\"},\n    X3Y2:{Texto:\"Verificar se tem habilidades para administrar projetos a longo prazo.\", CorFundo:\"#c6f0d1\", CorTexto:\"black\"},\n    X3Y3:{Texto:\"Grande potencial. Pode delegar mais responsabilidades.\", CorFundo:\"#b5e7a0\", CorTexto:\"black\"},\n\n    //HABILITAR LINHAS MARCAÇÃO NOTAS\n    LinhaHorizontal:true,\n    LinhaVertical:true,\n    EstiloLinhaHorizontal:\"border-left: 1px dashed gray\",\n    EstiloLinhaVertical:\"border-top: 1px dashed gray\",\n    \n    //QUADRANTES ESTILO GERAL\n    EspacamentoQuadrantes:\"10px\", //Só funciona quando as linhas de marcação das notas estão desabilitadas\n    Estilo:\"border: 0px solid black; padding: 20px; box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2); border-radius: 00px;\"\n\n},\n\n\nWith({\n    LarguraTable:Substitute(Largura,\"px\",\"\") -20,\n    AlturaTable:Substitute(Altura,\"px\",\"\") -20,\n    NotaDesempenho:Average(colMetasAvaliacaoColaboradores,Peso*Resposta/100),\n    NotaPotencial:Average(colAvaliacoesColaboradoresRespostas,RespostaCalibrada)\n    },\nWith({\n    PosicaoXLinha:Substitute(NotaDesempenho/NotaMaxima*(LarguraTable-20),\",\",\".\"),\n    PosicaoYLinha:Substitute((NotaMaxima-NotaPotencial)/NotaMaxima*(AlturaTable-20),\",\",\".\")\n    },\n\n\"\n<div style='width: 100%; height: 100%;display: flex;justify-content: center;'>\n<div style='display: flex; flex-direction: column; width: \"&Largura&\"; height: \"&Altura&\";'>\n    <div style='flex-grow: 1; background-color: transparent; display: flex; justify-content: center; align-items: center; color: white;'>\n        <div style='display: flex; width: 100%; height: 100%;'>\n            <div style='flex: 0 0 20px;  background-color: \"&CorFundo&\";border-right: \"&LinhaEspessura & \" \"&LinhaTipo&\" \"&LinhaCor&\"; display: flex; justify-content: center; align-items: center; flex-direction: column;margin-bottom: -20px'><!-- DIV DA ESQUERDA -->\n                <span style='writing-mode: vertical-lr; transform: rotate(180deg); color: \"&CorTexto&\"; font-weight: bold;'>\"&TextoEixoY&\"</span>\n            </div>\n            <div style='position: relative;background-color: white; display: flex; justify-content: left; align-items: center;'><!-- DIV DA DIREITA -->\n                <table style='width: \"&LarguraTable&\"px; background-color: transparent;  table-layout: fixed; height: \"&AlturaTable&\"px; border-collapse: separate; border-spacing: \"&If(LinhaHorizontal || LinhaVertical,\"0px\", EspacamentoQuadrantes)&\"; text-align: center;'>\n                    <colgroup>\n                        <col style='width: calc((100% - 20px) / 3);'> <!-- Dividindo o restante por três -->\n                        <col style='width: calc((100% - 20px) / 3);'>\n                        <col style='width: calc((100% - 20px) / 3);'>\n                    </colgroup>\n                    <tr>\n                        <td style='border: none; width: 20px;color: black;writing-mode: vertical-lr; transform: rotate(-180deg);'>\"&Y3&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X3Y1.CorFundo&\"; color: \"&X3Y1.CorTexto&\";height: 33%;'>\"&X3Y1.Texto&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X3Y2.CorFundo&\"; color: \"&X3Y2.CorTexto&\";height: 33%;'>\"&X3Y2.Texto&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X3Y3.CorFundo&\"; color: \"&X3Y3.CorTexto&\";height: 33%;'>\"&X3Y3.Texto&\"</td>\n                    </tr>\n                    <tr>\n                        <td style='border: none; width: 20px;color: black;writing-mode: vertical-lr; transform: rotate(-180deg);'>\"&Y2&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X2Y1.CorFundo&\"; color: \"&X2Y1.CorTexto&\";height: 33%;'>\"&X2Y1.Texto&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X2Y2.CorFundo&\"; color: \"&X2Y2.CorTexto&\";height: 33%;'>\"&X2Y2.Texto&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X2Y3.CorFundo&\"; color: \"&X2Y3.CorTexto&\";height: 33%;'>\"&X2Y3.Texto&\"</td>\n                    </tr>\n                    <tr>\n                        <td style='border: none; width: 20px;color: black;writing-mode: vertical-lr; transform: rotate(-180deg);'>\"&Y1&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X1Y1.CorFundo&\"; color: \"&X1Y1.CorTexto&\";height: 33%;'>\"&X1Y1.Texto&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X1Y2.CorFundo&\"; color: \"&X1Y2.CorTexto&\";height: 33%;'>\"&X1Y2.Texto&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X1Y3.CorFundo&\"; color: \"&X1Y3.CorTexto&\";height: 33%;'>\"&X1Y3.Texto&\"</td>\n                    </tr>\n                    <tr>\n                        <td style='border: none;'></td>\n                        <td style='border: none;color: black;'>\"&X1&\"</td>\n                        <td style='border: none;color: black;'>\"&X2&\"</td>\n                        <td style='border: none;color: black;'>\"&X3&\"</td>\n                    </tr>\n                </table>\" &\n                If(LinhaVertical,\n                \n                \"<!-- Linha Vertical Pontilhada -->\n                <div style=\"\"position: absolute;margin-left:20px; left: \"&PosicaoXLinha&\"px; width: 0; height: 100%; \"&EstiloLinhaHorizontal&\";\"\"></div>\"\n                ) &\n\n                If(LinhaHorizontal,\n        \n                \"<!-- Linha Horizontal Pontilhada -->\n                <div style=\"\"position: absolute;margin-top:2px; top: \"&PosicaoYLinha&\"px; height: 0; width: 100%; \"&EstiloLinhaVertical&\";\"\"></div>\"\n                ) &\n                \n            \"</div>\n        </div>\n    </div>\n    <div style='flex: 0 0 20px; background-color: \"&CorFundo&\";border-top: \"&LinhaEspessura&\" \"&LinhaTipo&\" \"&LinhaCor&\"; display: flex; justify-content: center; align-items: center;margin-left: 0px;'>\n        <span style='color: \"&CorTexto&\"; font-weight: bold;'>\"&TextoEixoX&\"</span>\n    </div>\n</div>\n</div>\"\n)))"
            Size: =8
            Width: =1009
            X: =68
            Y: =132
