n            <animate fill='freeze' attributeName='fill-opacity' dur='0.92s' values='1;0'/>\r\n        </path>\r\n        <path d='M19.61 12.25L21.25 11L19.19 10.95L18.5 9L17.81 10.95L15.75 11L17.39 12.25L16.8 14.23L18.5 13.06L20.2 14.23L19.61 12.25Z'>\r\n            <animate fill='freeze' attributeName='fill-opacity' begin='0.46s' dur='0.92s' values='1;0'/>\r\n        </path>\r\n    </g>\r\n    <g fill='\"&TCor.TextInverted&\"' stroke='\"&TCor.TextInverted&\"' stroke-linecap='round' stroke-linejoin='round' stroke-width='0.95'>\r\n        <path d='M7 6 C7 12.08 11.92 17 18 17 C18.53 17 19.05 16.96 19.56 16.89 C17.95 19.36 15.17 21 12 21 C7.03 21 3 16.97 3 12 C3 8.83 4.64 6.05 7.11 4.44 C7.04 4.95 7 5.47 7 6 Z'/>\r\n        <set attributeName='opacity' begin='1.38s' to='0'/>\r\n    </g>\r\n    <mask id='lineMdMoonFilledToSunnyFilledLoopTransition0'>\r\n        <circle cx='12' cy='12' r='12' fill='#fff'/>\r\n            <circle cx='18' cy='6' r='12' fill='#fff'>\r\n                <animate fill='freeze' attributeName='cx' begin='1.38s' dur='0.92s' values='18;22'/>\r\n                <animate fill='freeze' attributeName='cy' begin='1.38s' dur='0.92s' values='6;2'/>\r\n                <animate fill='freeze' attributeName='r' begin='1.38s' dur='0.92s' values='12;3'/>\r\n            </circle>\r\n        <circle cx='18' cy='6' r='10'>\r\n            <animate fill='freeze' attributeName='cx' begin='1.38s' dur='0.92s' values='18;22'/>\r\n            <animate fill='freeze' attributeName='cy' begin='1.38s' dur='0.92s' values='6;2'/>\r\n            <animate fill='freeze' attributeName='r' begin='1.38s' dur='0.92s' values='10;1'/>\r\n        </circle>\r\n    </mask>\r\n        <circle cx='12' cy='12' r='10' fill='\"&TCor.TextInverted&\"' mask='url(#lineMdMoonFilledToSunnyFilledLoopTransition0)' opacity='0'>\r\n            <set attributeName='opacity' begin='1.38s' to='1'/>\r\n            <animate fill='freeze' attributeName='r' begin='1.38s' dur='0.92s' values='10;6'/>\r\n      