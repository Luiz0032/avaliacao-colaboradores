                        Image: "=With({\r\n    IconSVG:\r\n    \"\r\n    <line x1='256' y1='112' x2='256' y2='400' style='fill:none;stroke:#000;stroke-linecap:round;stroke-linejoin:round;stroke-width:32px'/><line x1='400' y1='256' x2='112' y2='256' style='fill:none;stroke:#000;stroke-linecap:round;stroke-linejoin:round;stroke-width:32px'/></svg>\r\n    \"\r\n    ,\r\n    IconText:\"Criar Item\",\r\n    IconColor: TCor.TextInverted,\r\n    TextColor:TCor.TextInverted,\r\n    TextSize:14,\r\n    TextCenter:true,\r\n    PaddingText:0,\r\n    PaddingIcon:18,\r\n    varLoading:false, //If you want that the icon stay loading in some situation, just put a boolean variable\r\n    TextLoading:\"Loading\",\r\n    FontFamily:\"Arial\" //Tahoma, Verdana, Impact..\r\n},\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n//Renderização do botão (autoria própria): ícone à esquerda e texto opcional\r\nWith(\r\n    {\r\n        Largura: Round(Self.Width, 0),\r\n        Altura: Round(Self.Height, 0),\r\n        TemTexto: !IsBlank(IconText) && Self.Width > Self.Height,\r\n        TamIcone: Round(Max(Self.Height - PaddingIcon * 2, 8), 0)\r\n    },\r\n    With(\r\n        {\r\n            IconeX: If(TemTexto, PaddingIcon, Round((Largura - TamIcone) / 2, 0)),\r\n            IconeY: Round((Altura - TamIcone) / 2, 0),\r\n            Centro: Round(TamIcone / 2, 0),\r\n            TextoExibido: If(varLoading, TextLoading, IconText)\r\n        },\r\n        \"data:image/svg+xml;utf8, \" & EncodeUrl(\r\n            $\"<svg xmlns='http://www.w3.org/2000/svg' width='{Largura}' height='{Altura}' viewBox='0 0 {Largura} {Altura}'>\" &\r\n            $\"<svg x='{IconeX}' y='{IconeY}' width='{TamIcone}' height='{TamIcone}' viewBox='0 0 512 512' style='fill:{IconColor}'>\" &\r\n            If(\r\n                varLoading || IsBlank(IconSVG),\r\n                $\"<circle cx='256' cy='256' r='200' fill='none' stroke='{IconColor}' stroke-width='48' stroke-linecap='round' stroke-dasharray='420 1260'><animateTransform attributeName='transform' type='rotate' from='0 256 256' to='360 256 256' dur='0.9s' repeatCount='indefinite'/></circle></svg>\",\r\n                Substitute(IconSVG, \"#000\", IconColor)\r\n            ) &\r\n            If(\r\n                TemTexto,\r\n                $\"<text x='{If(TextCenter, Round((IconeX + TamIcone + Largura) / 2, 0) + PaddingText, IconeX + TamIcone + 10 + PaddingText)}' y='50%' dominant-baseline='middle' text-anchor='{If(TextCenter, \"middle\", \"start\")}' font-family='{FontFamily}' font-size='{TextSize}' fill='{TextColor}'>{TextoExibido}</text>\"\r\n            ) &\r\n            \"</svg>\"\r\n        )\r\n    )\r\n)\r\n)\r\n"
