                  AlignInContainer: =AlignInContainer.Stretch
                  BorderColor: =Cor.Border
                  BorderThickness: =1
                  ChevronBackground: =Cor.BackgroundInput
                  ChevronDisabledBackground: =Cor.Disabled
                  ChevronDisabledFill: =Cor.Disabled
                  ChevronFill: =Cor.TextStandard
                  ChevronHoverBackground: =Cor.BackgroundInput
                  ChevronHoverFill: =Cor.TextStandard
                  Color: =Cor.TextStandard
                  DisabledBorderColor: =Cor.Disabled
                  DisabledColor: =Cor.DisabledText
                  DisabledFill: =Cor.Disabled
                  DisplayFields: =["NomeColaborador"]
                  Fill: =Cor.BackgroundInput
                  FocusedBorderThickness: =1
                  Font: =Font.'Open Sans'
                  HoverColor: =Cor.TextStandard
                  HoverFill: =Cor.BackgroundInputHover
                  InputTextPlaceholder: ="Selecione o usuário"
                  Items: =colBaseColaboradores
                  PressedColor: =Cor.TextStandard
                  PressedFill: =ColorFade(Self.HoverFill, 20%)
                  SearchFields: =["NomeColaborador"]
                  SelectMultiple: =false
                  SelectionColor: =Cor.TextInverted
                  SelectionFill: =Cor.Primary
                  Size: =10
                  Width: =320
            - btn_Start:
                Control: Classic/Button@2.2.0
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderColor: =Self.Fill
                  BorderThickness: =Metadados.EspessuraBordaBotao
                  Color: =Cor.TextInverted
                  DisabledBorderColor: =Cor.Disabled
                  DisabledColor: =Cor.DisabledText
                  DisabledFill: =Cor.DisabledButton
                  Fill: =Cor.Primary
                  FocusedBorderThickness: =Metadados.EspessuraBordaBotao
                  Font: =Font.'Open Sans'
                  HoverBorderColor: =Self.HoverFill
                  HoverColor: =Self.Color
                  HoverFill: =ColorFade(Self.Fill, -10%)
                  OnSelect: |-
                    =Set(varCarregando,true);
                    Set(varIniciou,true);
                    //________________________________________________________________

                    Concurrent(
                        ClearCollect(colBaseColaboradores,BaseColaboradores),
                        ClearCollect(colStatusAvaliacoes,StatusAvaliacoes),
                        ClearCollect(colBaseCargos,BaseCargos),
                        ClearCollect(colBaseDptos,BaseDptos),
                        ClearCollect(colBaseAvaliacoes,BaseAvaliacoes)
                    );

                    Set(varColab,Coalesce(drp_FalseStart.Selected,LookUp(colBaseColaboradores,EmailColaborador=Lower(User().Email))));

                    ClearCollect(colAvaliacoes,Filter(AvaliacoesColaboradores,CodColaborador=Value(varColab.CodColaborador) || CodGestor=Value(varColab.CodColaborador)));


                    //________________________________________________________________
                    Reset(tg_FalsoStart);
                    Set(varCarregando,false);
                  PressedBorderColor: =Self.PressedFill
                  PressedFill: =ColorFade(Self.Fill, -30%)
                  RadiusBottomLeft: =5
                  RadiusBottomRight: =5
                  RadiusTopLeft: =5
                  RadiusTopRight: =5
                  Size: =10
                  Text: ="Simular Acesso"
