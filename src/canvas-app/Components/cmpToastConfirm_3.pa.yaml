ComponentDefinitions:
  cmpToastConfirm_3:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      BackgroundColor:
        PropertyKind: Input
        DisplayName: Background Color
        Description: Uma propriedade personalizada
        DataType: Text
        Default: =TCor.TransparentBlack
      BarTimer:
        PropertyKind: Input
        DisplayName: 'Bar Timer '
        Description: Uma propriedade personalizada
        DataType: Boolean
        Default: =false
      BottomHeight:
        PropertyKind: Input
        DisplayName: Bottom Height
        Description: Uma propriedade personalizada
        DataType: Number
        Default: =100
      BtnCancel:
        PropertyKind: Input
        DisplayName: Btn Cancel
        Description: Uma propriedade personalizada
        DataType: Boolean
        Default: =true
      BtnWidth:
        PropertyKind: Input
        DisplayName: Btn Width
        Description: Uma propriedade personalizada
        DataType: Number
        Default: =150
      BtnWidthFlex:
        PropertyKind: Input
        DisplayName: Btn Width Flex
        Description: Uma propriedade personalizada
        DataType: Boolean
        Default: =true
      CenterHeight:
        PropertyKind: Input
        DisplayName: Center Height
        Description: Uma propriedade personalizada
        DataType: Number
        Default: =350
      CenterWidth:
        PropertyKind: Input
        DisplayName: Center Width
        Description: Uma propriedade personalizada
        DataType: Number
        Default: =600
      FadeColor:
        PropertyKind: Input
        DisplayName: Fade Color
        Description: 0 - 1
        DataType: Number
        Default: =0.1
      Info:
        PropertyKind: Input
        DisplayName: Info
        Description: Uma propriedade personalizada
        DataType: Text
        Default: |-
          ="
          > Em relação ao componente de Power Apps

          Este componente foi desenvolvido por Daniel Petrin (Mundo Power) e é de uso exclusivo dos alunos da Comunidade Mundo Power.

          Versão 1.0.0
          Publicada em 25/01/2024

          www.mundopower.com.br

          > Em relação ao licenciamento dos ícones:

          The MIT License (MIT)

          Copyright (c) 2015-present Ionic (http://ionic.io/)

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the 'Software'), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          "
      MainColor:
        PropertyKind: Input
        DisplayName: Main Color
        Description: Uma propriedade personalizada
        DataType: Text
        Default: =TCor.Delete
      OnSelect_Cancel:
        PropertyKind: Event
        DisplayName: OnSelect_Cancel
        Description: Uma propriedade personalizada
        ReturnType: Boolean
        Default: =
      OnSelect_Main:
        PropertyKind: Event
        DisplayName: OnSelect_Main
        Description: Uma propriedade personalizada
        ReturnType: Boolean
        Default: |-
          =Set(varCarregando,true);

              //Remove(colTabela;locItem);;
              //RemoveIf(Tabela;ID=locItem.ID);;

          Set(varCarregando,false);

          Notify("Item excluído com sucesso!",NotificationType.Success,2000);
      SVG:
        PropertyKind: Input
        DisplayName: SVG
        Description: Uma propriedade personalizada
        DataType: Text
        Default: ="<path d='M449.07,399.08,278.64,82.58c-12.08-22.44-44.26-22.44-56.35,0L51.87,399.08A32,32,0,0,0,80,446.25H420.89A32,32,0,0,0,449.07,399.08Zm-198.6-1.83a20,20,0,1,1,20-20A20,20,0,0,1,250.47,397.25ZM272.19,196.1l-5.74,122a16,16,0,0,1-32,0l-5.74-121.95v0a21.73,21.73,0,0,1,21.5-22.69h.21a21.74,21.74,0,0,1,21.73,22.7Z'/></svg>"
      Text1:
        PropertyKind: Input
        DisplayName: Text 1
        Description: Uma propriedade personalizada
        DataType: Text
        Default: ="Atenção!"
      Text1Size:
        PropertyKind: Input
        DisplayName: Text 1 - Size
        Description: Uma propriedade personalizada
        DataType: Number
        Default: =20
      Text2:
        PropertyKind: Input
        DisplayName: Text 2
        Description: Uma propriedade personalizada
        DataType: Text
        Default: ="Você quer mesmo excluir este item?"
      Text2Size:
        PropertyKind: Input
        DisplayName: Text 2 - Size
        Description: Uma propriedade personalizada
        DataType: Text
        Default: =12
      TextBtnCancel:
        PropertyKind: Input
        DisplayName: Text Btn - Cancel
        Description: Uma propriedade personalizada
        DataType: Text
        Default: ="Cancelar"
      TextBtnMain:
        PropertyKind: Input
        DisplayName: Text Btn - Main
        Description: Uma propriedade personalizada
        DataType: Text
        Default: ="Excluir"
      TextColor:
        PropertyKind: Input
        DisplayName: Text Color
        Description: Uma propriedade personalizada
        DataType: Text
        Default: ="#ffffff"
      TimerSeconds:
        PropertyKind: Input
        DisplayName: Timer (Seconds)
        Description: If greater then 0, will run Main Button on timer end
        DataType: Number
        Default: =0
    Properties:
      Fill: =ColorValue(Self.BackgroundColor)
      Height: =Max(App.Height, App.MinScreenHeight)
      Width: =Max(App.Width, App.MinScreenWidth)
    Children:
      - Container45_3:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Cor.Transparent
            Height: =Parent.CenterHeight
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =Parent.CenterWidth
            X: =Parent.Width/2-Self.Width/2
            Y: =Parent.Height/2-Self.Height/2
          Children:
            - Container46_3:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Cor.Transparent
                  FillPortions: =3
                  Height: =Parent.Height-Self.Y*2
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width-Self.X*2
                Children:
                  - Rectangle7_8:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =Cor.Border
                        Fill: =ColorFade(ColorValue(cmpToastConfirm_3.MainColor),cmpToastConfirm_3.FadeColor)
                        FocusedBorderThickness: =0
                        Height: =Parent.Height
                        Width: =Parent.Width
                  - Triangle1_8:
                      Control: Triangle@2.3.0
                      Variant: RightAngled
                      Properties:
                        BorderColor: =Cor.Border
                        Fill: =ColorValue(cmpToastConfirm_3.MainColor)
                        FocusedBorderThickness: =0
                        Height: =Parent.Height
                        Width: =Parent.Width
                  - Container47_3:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Cor.Transparent
                        Height: =Parent.Height-Self.Y*2
                        LayoutDirection: =LayoutDirection.Vertical
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width-Self.X*2
                      Children:
                        - Image2_6:
                            Control: Image@2.2.3
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =Cor.Border
                              DisabledBorderColor: =Cor.Disabled
                              DisabledFill: =Cor.Disabled
                              FocusedBorderThickness: =0
                              Image: ="data:image/svg+xml;utf8, " &  EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 512 512' style='fill:"&cmpToastConfirm_3.TextColor&"'>" &  Substitute(cmpToastConfirm_3.SVG,"#000",cmpToastConfirm_3.TextColor))
                        - Label5_33:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =Cor.Border
                              Color: =Cor.White
                              DisabledColor: =Cor.DisabledText
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =cmpToastConfirm_3.Text1Size
                              Text: =cmpToastConfirm_3.Text1
                        - Label5_40:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =Cor.Border
                              Color: =Cor.White
                              DisabledColor: =Cor.DisabledText
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =cmpToastConfirm_3.Text2Size
                              Text: =cmpToastConfirm_3.Text2
            - c3_19:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: |+
                    =Cor.BackgroundStandard
                  FillPortions: =0
                  Height: =cmpToastConfirm_3.BottomHeight
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =20
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutWrap: =true
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width-Self.X*2
                Children:
                  - Button3_50:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =Self.Fill
                        BorderThickness: =Metadados.EspessuraBordaBotao
                        Color: =Cor.TextInverted
                        DisabledBorderColor: =Cor.Disabled
                        DisabledColor: =Cor.DisabledText
                        DisabledFill: =Cor.DisabledButton
                        Fill: =Cor.Cancel
                        FillPortions: =cmpToastConfirm_3.BtnWidthFlex
                        FocusedBorderThickness: =Metadados.EspessuraBordaBotao
                        Font: =Font.'Open Sans'
                        HoverBorderColor: =Self.HoverFill
                        HoverColor: =Self.Color
                        HoverFill: =ColorFade(Self.Fill, -10%)
                        OnSelect: =cmpToastConfirm_3.OnSelect_Cancel()
                        PressedBorderColor: =Self.PressedFill
                        PressedFill: =ColorFade(Self.Fill, -30%)
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Size: =10
                        Text: =cmpToastConfirm_3.TextBtnCancel
                        Visible: =cmpToastConfirm_3.BtnCancel
                        Width: =cmpToastConfirm_3.BtnWidth
                  - Button3_51:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =Self.Fill
                        BorderThickness: =Metadados.EspessuraBordaBotao
                        Color: =Cor.TextInverted
                        DisabledBorderColor: =Cor.Disabled
                        DisabledColor: =Cor.DisabledText
                        DisabledFill: =Cor.DisabledButton
                        Fill: =ColorValue(cmpToastConfirm_3.MainColor)
                        FillPortions: =cmpToastConfirm_3.BtnWidthFlex
                        FocusedBorderThickness: =Metadados.EspessuraBordaBotao
                        Font: =Font.'Open Sans'
                        HoverBorderColor: =Self.HoverFill
                        HoverColor: =Self.Color
                        HoverFill: =ColorFade(Self.Fill, -10%)
                        OnSelect: |-
                          =cmpToastConfirm_3.OnSelect_Main();
                          Set(varResetTimer,true)
                        PressedBorderColor: =Self.PressedFill
                        PressedFill: =ColorFade(Self.Fill, -30%)
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Size: =10
                        Text: =cmpToastConfirm_3.TextBtnMain & If(cmpToastConfirm_3.TimerSeconds>0, " (" & Round((Timer2_3.Duration - Timer2_3.Value)/1000,0) & ")")
                        Width: =cmpToastConfirm_3.BtnWidth
            - Rectangle7_3:
                Control: Rectangle@2.3.0
                Properties:
                  AlignInContainer: =AlignInContainer.Start
                  BorderColor: =Cor.Border
                  Fill: =ColorValue(cmpToastConfirm_3.MainColor)
                  FocusedBorderThickness: =0
                  Height: =10
                  LayoutMinWidth: =cmpToastConfirm_3.CenterWidth / If(Timer2_3.Duration>0,Timer2_3.Duration/1000,1) * Timer2_3.Value /1000
                  Visible: =cmpToastConfirm_3.BarTimer
                  Width: =cmpToastConfirm_3.CenterWidth / If(Timer2_3.Duration>0,Timer2_3.Duration/1000,1) * Timer2_3.Value /1000
      - Timer2_3:
          Control: Timer@2.1.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =Cor.TextInverted
            DisabledBorderColor: =Self.DisabledColor
            DisabledColor: =Cor.DisabledText
            DisabledFill: =Color.Transparent
            Duration: =Parent.TimerSeconds*1000
            Fill: =Cor.Primary
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =ColorFade(Self.Fill, -10%)
            OnTimerEnd: |-
              =Parent.OnSelect_Main();
              Reset(Self);
              Set(varResetTimer,true)
            OnTimerStart: =Set(varResetTimer,false)
            PressedBorderColor: =Self.Fill
            PressedFill: =ColorFade(Self.Fill, -30%)
            RadiusBottomLeft: =5
            RadiusBottomRight: =5
            RadiusTopLeft: =5
            RadiusTopRight: =5
            Reset: =varResetTimer
            Size: =10
            Start: =If(Parent.TimerSeconds>0,Parent.Visible)
            Visible: =false
            X: =40
            Y: =40
