olor}' stroke-width='48' stroke-linecap='round' stroke-dasharray='420 1260'><animateTransform attributeName='transform' type='rotate' from='0 256 256' to='360 256 256' dur='0.9s' repeatCount='indefinite'/></circle></svg>\",\r\n                Substitute(IconSVG, \"#000\", IconColor)\r\n            ) &\r\n            If(\r\n                TemTexto,\r\n                $\"<text x='{If(TextCenter, Round((IconeX + TamIcone + Largura) / 2, 0) + PaddingText, IconeX + TamIcone + 10 + PaddingText)}' y='50%' dominant-baseline='middle' text-anchor='{If(TextCenter, \"middle\", \"start\")}' font-family='{FontFamily}' font-size='{TextSize}' fill='{TextColor}'>{TextoExibido}</text>\"\r\n            ) &\r\n            \"</svg>\"\r\n        )\r\n    )\r\n)\r\n)\r\n"
