                        Height: =768
                        HtmlText: "=With({Base64Img:\r\n\r\n\"data:image/png;base64,\"},\r\n\r\n\"\r\n\r\n<!DOCTYPE html>\r\n<html>\r\n    <head>\r\n        <meta charset='utf-8'>\r\n    <title>AVALIAÇÃO</title>\r\n        <meta name='viewport' content='width=device-width, initial-scale=1'>\r\n    </head>\r\n\r\n<style>\r\n    * {\r\n        box-sizing: border-box;\r\n    }\r\n\r\n    body {\r\n        font-family: 'Segoe UI', sans-serif;\r\n    }\r\n\r\n    table {\r\n        font-size: 12px;\r\n        border-style: dashed;\r\n        border-width: 1px;\r\n        border-spacing: 1;\r\n        border-collapse: collapse;\r\n    }\r\n\r\n    table th {\r\n        background-color: gainsboro;\r\n        color: solid gray;\r\n        border-style: solid;\r\n        border-width: 1px;\r\n        border-spacing: 1;\r\n        padding: 7px;\r\n\r\n    }\r\n\r\n    table td {\r\n        border-style: solid;\r\n        border-width: 1px;\r\n        border-spacing: 1;\r\n        text-align: center;\r\n        padding: 7px;\r\n    }\r\n\r\n    table tbody tr td:first-child {\r\n        text-align: left;\r\n    }\r\n</style>\r\n\r\n\r\n<!-- Esta DIV determinar a largura máxima -->\r\n<div style='max-width: 1100px; width: 100%; margin: 0 auto; border: 0px solid gray; padding-top: 0px;'>\r\n\r\n    <!-- Esta DIV tem a imagem da empresa -->\r\n    <div style='width: 100%; height:50px; background-color:transparent; color:white; display:flex; justify-content:right; padding:10px; align-items:center;'>\r\n       \r\n    </div>\r\n\r\n    <br>\r\n\r\n    <!-- Esta DIV tem um título -->\r\n    <div style='width: 100%; height:30px; background-color:#333; color:white; display:flex; justify-content:center; padding:10px; align-items:center;'>\r\n    <h3>\"&varBaseAvaliacao.NomeAvaliacao&\"</h3>\r\n    </div>\r\n<div style='width: 100%; height:30px; background-color:transparent; color:333; display:flex; justify-content:center; padding:10px; align-items:center;'>\r\n    <h5>\"&varBaseAvaliacao.PeriodoAvaliacao&\"</h5>\r\n    </div>\r\n    <br>\r\n\r\n    <!-- Esta DIV tem as informações do topo do documento -->\r\n    <div style='width: 100%; margin: 0 auto; border: 0px solid gray; padding-top: 0px;'>\r\n        <table style='border-collapse: collapse; border: 1px solid #ddd; width: 100%;'>\r\n            <tr>\r\n                <td style='border: 1px solid #ddd; padding: 10px; width: 50%;'>Colaborador: <b>\" & LookUp(colBaseColaboradores,CodColaborador=Text(varAvaliacao.CodGestor),NomeColaborador)  & \"</td>\r\n                <td style='border: 1px solid #ddd; padding: 10px; width: 25%;'>Cargo: <b>\" & LookUp(colBaseCargos,CodCargo=LookUp(colBaseColaboradores,CodColaborador=Text(varAvaliacao.CodGestor),CodCargo),NomeCargo)  & \"</td>\r\n                <td style='border: 1px solid #ddd; padding: 10px; width: 25%;'>Dpto: <b>\" & LookUp(colBaseDptos,CodDpto=LookUp(colBaseColaboradores,CodColaborador=Text(varAvaliacao.CodGestor),CodDpto),NomeDpto)  & \"</td>\r\n            </tr>\r\n            <tr>\r\n                                <td style='border: 1px solid #ddd; padding: 10px; width: 50%;'>Gestor: <b>\" & LookUp(colBaseColaboradores,CodColaborador=Text(varAvaliacao.CodColaborador),NomeColaborador)  & \"</td>\r\n                <td style='border: 1px solid #ddd; padding: 10px; width: 25%;'>Cargo: <b>\" & LookUp(colBaseCargos,CodCargo=Text(varAvaliacao.Cargo),NomeCargo)  & \"</td>\r\n                <td style='border: 1px solid #ddd; padding: 10px; width: 25%;'>Dpto: <b>\" & LookUp(colBaseDptos,CodDpto=Text(varAvaliacao.Dpto),NomeDpto)  & \"</td>\r\n            </tr>\r\n        </table>\r\n    </div>\r\n\r\n    <br><br>\r\n\r\n    <h3 style='text-align: center;'>DESEMPENHO METAS</h3>\" &\r\n\r\n    html_acelerometro.HtmlText &  \r\n\r\n    \"<br>\r\n\r\n    <h3 style='text-align: center;'>COMPETÊNCIAS</h3>\" &    \r\n    html_Radar.HtmlText &   \r\n\r\n    \"<br><br>\r\n\r\n    <h2 style='break-before: page;'>METAS</h2>\r\n    \r\n    <!-- Esta DIV tem as informações do conteúdo -->\r\n    <div style='width: 100%; margin: 0 auto; border: 0px solid gray; padding-top: 0px;'>\r\n        <table width='100%' cellpadding='10' border=1 style='border:1px solid #BDBDBD ; border-collapse:collapse'>\r\n            <tr style='border 1px solid #BDBDBD; background-color:#f0f0f0'>\r\n                <th> ITENS </th>\r\n            </tr>\" &\r\n                \r\n            Concat(colMetasAvaliacaoColaboradores,\r\n                    \"\r\n            <tr>\r\n                <td align='left' style='border: 1px solid #BDBDBD'>\r\n                \r\n                    <b>META: \" & TituloMeta & \"</b> - (Peso: \" & Peso & \")\" &\r\n                    If(!IsBlank(DescricaoMeta),\"<p>\" & DescricaoMeta & \"<br>\") &\r\n                    \"<br><br><p><b> Comentário Colaborador: </b><p>\" &\r\n                    Coalesce(ComentarioColab, \"<i>Nenhum comentário</i>\") &\r\n                    \"<br><br><br><p><b> Comentário Gestor: </b><p>\" &\r\n                    Coalesce(ComentarioGestor,\"<i>Nenhum comentário</i>\") &\r\n                    \"<br><br><br><p><b><font size=2><span style='background-color:#D1FFF1;border-radius: 7px;margin-right: 5px;padding-left: 5px;padding-right: 5px;padding-bottom:5px;padding-top: 5px;display: inline-block;'>Resposta: \" &\r\n                    LookUp(colRespostasMetas,Nota=Resposta,Texto) & \"</b></span>\r\n                    \r\n                    \r\n                </td>\r\n            </tr>\"\r\n            )&\r\n        \"</table>\r\n    </div>\r\n\r\n    <br><br>\r\n\r\n    \r\n    <h2 style='break-before: page;'>COMPETÊNCIAS</h2>\r\n    <!-- Esta DIV tem as informações do conteúdo -->\r\n    <div style='width: 100%; margin: 0 auto; border: 0px solid gray; padding-top: 0px;'>\r\n        <table width='100%' cellpadding='10' border=1 style='border:1px solid #BDBDBD ; border-collapse:collapse'>\r\n            <tr style='border 1px solid #BDBDBD; background-color:#f0f0f0'>\r\n                <th> ITENS </th>\r\n            </tr>\" &\r\n                \r\n            Concat(colAvaliacoesColaboradoresRespostas,\r\n                    \"\r\n            <tr>\r\n                <td align='left' style='border: 1px solid #BDBDBD'>\r\n                \r\n                    <font size=4><b>\" & CategoriaPergunta & \" - \" & LookUp(colBaseAvaliacoesItens,ID=IdItem,TituloItem) & \"</b></font><br>\"  &\r\n                    LookUp(colBaseAvaliacoesItens,ID=IdItem,DescricaoItem) & \"<br>\" &\r\n                    \"<br><br><p><b> Comentário Colaborador: </b><p>\" &\r\n                    Coalesce(ComentarioColab, \"<i>Nenhum comentário</i>\") &\r\n                    \"<br><br><b>Avaliação: </b>\" & RespostaColab &\r\n                    \"<br><br><br><p><b> Comentário Gestor: </b><p>\" &\r\n                    Coalesce(ComentarioGestor,\"<i>Nenhum comentário</i>\") &\r\n                    \"<br><br><b>Avaliação: </b>\" & RespostaGestor &\r\n                    \"<br><br><br><p><b><font size=2><span style='background-color:#D1FFF1;border-radius: 7px;margin-right: 5px;padding-left: 5px;padding-right: 5px;padding-bottom:5px;padding-top: 5px;display: inline-block;'> Avaliação Calibrada: \" & RespostaCalibrada & \"</b></span>\r\n                                       \r\n                </td>\r\n            </tr>\"\r\n            )&\r\n        \"</table>\r\n    </div>\r\n\r\n<br><br>\r\n\r\n\r\n<h2 style='break-before: page;'>MATRIZ 9BOX</h2>\r\n<hr><br><br>\r\n\"\r\n\r\n&\r\n\r\nhtml_9box.HtmlText\r\n\r\n&\r\n\r\n\"</div>\"\r\n\r\n)\r\n\r\n\r\n\r\n\r\n"
                        Size: =8
                        Width: =845
                        X: =519
      - html_acelerometro:
          Control: HtmlViewer@2.1.0
          Properties:
            Color: =Cor.TextStandard
            DisabledBorderColor: =Cor.Disabled
            Font: =Font.'Open Sans'
            Height: =91
            HtmlText: |-
              ="<div style='width: 100%; height: 100%;display: flex;justify-content: center;'>
              <img src='" &

              With({Max:3},
                  With(
                      {
                          Value:Substitute(Sum(colMetasAvaliacaoColaboradores,Peso*Resposta/100),",","."),
                          Color:"getGradientFillHelper('horizontal', ['red', 'orange', 'green','green'])"
                      },

              "https://quickchart.io/chart?c=" & EncodeUrl("

              {
                  type: 'gauge',
                  data: {
                      labels: [],
                      datasets: [
                      {
                          data: ["&Concat(Sequence(Max),Value,",")&"],
                          value: "&Value&",
                          minValue: 0,
                          backgroundColor: "&Color&",
                          borderWidth: 1,
                      },
                      ],
                  },
                  options: {
                      cutoutPercentage: 80,
                      legend: {
                      display: false,
                      },
                      needle: {
                      radiusPercentage: 1,
                      widthPercentage: 1,
                      lengthPercentage: 60,
                      color: '"&TCor.TextStandard &"',
                      },
                      valueLabel: {
                      fontSize: 32,
                      backgroundColor: 'transparent',
                      color: '"&TCor.TextStandard &"',
                      formatter: function (value, context) {
                          return value;
                      },
                      bottomMarginPercentage: 10,
                      },
                      plugins: {
                      datalabels: {
                          'align': 'center',
                          'anchor': 'top',
                          display: 'auto',
                          formatter: function (value, context) {
                          return context.chart.data.labels[context.dataIndex];
                          },
                          color: '#fff',
                          font: {
                          size: 18,
                          weight: 'normal',
                          },
                      },
                      },
                  },
                  }
                  "
              )))


               & "' style='width: 50%; height: auto;'/>
              </div>"
            Size: =8
            Visible: =false
            Width: =129
            X: =24
            Y: =264
      - html_Radar:
          Control: HtmlViewer@2.1.0
          Properties:
            Color: =Cor.TextStandard
            DisabledBorderColor: =Cor.Disabled
            Font: =Font.'Open Sans'
            Height: =204
            HtmlText: "=If(!IsEmpty(colAvaliacoesColaboradoresRespostas),\r\n\r\n\r\n\"<div style='width: 100%; height: 100%;display: flex;justify-content: center;'>\r\n<img src='\" &\r\n\r\n\r\nWith({\r\n    Label:Concat(GroupBy(colAvaliacoesColaboradoresRespostas,CategoriaPergunta,Grupo),\"'\" & CategoriaPergunta & \"'\",\",\"),\r\n    Value1:Concat(GroupBy(colAvaliacoesColaboradoresRespostas,CategoriaPergunta,Grupo),\"'\" & Substitute(Average(Grupo,RespostaCalibrada),\",\",\".\") & \"'\",\",\"),\r\n    Value2:Concat(GroupBy(colAvaliacoesColaboradoresRespostas,CategoriaPergunta,Grupo),\"'\" & Substitute(Average(Grupo,RespostaGestor),\",\",\".\") & \"'\",\",\"),\r\n    Value3:Concat(GroupBy(colAvaliacoesColaboradoresRespostas,CategoriaPergunta,Grupo),\"'\" & Substitute(Average(Grupo,RespostaColab),\",\",\".\") & \"'\",\",\")\r\n    },\r\n\r\n\"https://quickchart.io/chart?c=\" & EncodeUrl(\"\r\n\r\n{\r\n  type: 'radar',\r\n  data: {\r\n    labels: [\" & Label & \"],\r\n    datasets: [\r\n    {\r\n        backgroundColor: 'rgba(236,241,211,0.5)',\r\n        borderColor: '#00C425',\r\n        data: [\" & Value3 & \"],\r\n        label: 'Calibrado',\r\n    },\r\n    {\r\n        backgroundColor: 'rgba(153, 102, 255, 0.0)',\r\n        borderColor: 'rgb(153, 102, 255)',\r\n        data: [\" & Value2 & \"],\r\n        label: 'Gestor',\r\n    },\r\n    {\r\n        backgroundColor: 'rgba(255, 205, 86, 0.0)',\r\n        borderColor: 'rgb(255, 205, 86)',\r\n        data: [\" & Value1 & \"],\r\n        label: 'Colaborador',\r\n    },\r\n      \r\n      \r\n    ],\r\n  },\r\n  options: {\r\n    scale: {\r\n        ticks: {\r\n            beginAtZero: true, // Garante que a escala comece em zero\r\n            min: 0, // Define o valor mínimo para 0\r\n        }\r\n    },\r\n    spanGaps: false,\r\n    elements: {\r\n      line: {\r\n        tension: 0.000001,\r\n      },\r\n    },\r\n    \r\n  },\r\n}\"\r\n))\r\n\r\n& \"' style='width: 80%; height: auto;'/>\r\n</div>\"\r\n)"
            Size: =8
            Visible: =false
            Width: =221
            Y: =564
      - html_9box:
          Control: HtmlViewer@2.1.0
          Properties:
            Color: =Cor.TextStandard
            DisabledBorderColor: =Cor.Disabled
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =212
            HtmlText: "=With({\n\n    //Régua Notas (as notas são de 1 a ?\"\n    NotaMaxima:3,\n    \n    //Dimensões\n    Largura:\"600px\",\n    Altura:\"600px\",\n    \n    //Eixos X e Y\n    CorTexto:\"black\",\n    CorFundo:\"transparente\",\n    LinhaCor:\"black\",\n    LinhaEspessura:\"2px\",\n    LinhaTipo:\"solid\",\n\n\n    //LEGENDAS EIXOS\n    TextoEixoX:\"DESEMPENHO\",\n    TextoEixoY:\"POTENCIAL\",\n\n    //LEGENDAS QUADRANTES\n    X1:\"1\",\n    X2:\"2\",\n    X3:\"3\",\n    Y1:\"1\",\n    Y2:\"2\",\n    Y3:\"3\",\n\n    //QUADRANTES\n    //Linha 1\n    X1Y1:{Texto:\"Função exige mais que suas habilidades. Analisar demissão ou cargo de menor responsabilidade<br><font size=15>\U0001F601\", CorFundo:\"#f8d4d1\", CorTexto:\"black\"},\n    X1Y2:{Texto:\"Testar novas atribuições. Pode estar desmotivado\", CorFundo:\"#fde2c6\", CorTexto:\"black\"},\n    X1Y3:{Texto:\"Está bem na função. Verificar remuneração e manter cargo atual.\", CorFundo:\"#ffffd1\", CorTexto:\"black\"},\n    \n    //Linha 2\n    X2Y1:{Texto:\"Pode estar na área errada. Testar novas atribuiçoes.\", CorFundo:\"#fde2c6\", CorTexto:\"black\"},\n    X2Y2:{Texto:\"Está bem na função atual. Investir em capacitação para aumentar o desempenho.\", CorFundo:\"#ffffd1\", CorTexto:\"black\"},\n    X2Y3:{Texto:\"Tem potencial de liderança. Analisar possibilidade de pequenas promoções internas.\", CorFundo:\"#c6f0d1\", CorTexto:\"black\"},\n    \n    //Linha 3\n    X3Y1:{Texto:\"Tem potencial mas, pode estar mal aproveitado na área.\", CorFundo:\"#ffffd1\", CorTexto:\"black\"},\n    X3Y2:{Texto:\"Verificar se tem habilidades para administrar projetos a longo prazo.\", CorFundo:\"#c6f0d1\", CorTexto:\"black\"},\n    X3Y3:{Texto:\"Grande potencial. Pode delegar mais responsabilidades.\", CorFundo:\"#b5e7a0\", CorTexto:\"black\"},\n\n    //HABILITAR LINHAS MARCAÇÃO NOTAS\n    LinhaHorizontal:true,\n    LinhaVertical:true,\n    EstiloLinhaHorizontal:\"border-top:1px dashed gray\",\n    EstiloLinhaVertical:\"border-left:1px dashed gray\",\n    \n    //QUADRANTES ESTILO GERAL\n    EspacamentoQuadrantes:\"10px\", //Só funciona quando as linhas de marcação das notas estão desabilitadas\n    Estilo:\"border: 0px solid black; padding: 20px; box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2); border-radius: 00px;\"\n\n},\n\n// NAO PRECISA MEXER DAQUI PRA BAIXO-----------------------------------------------------\n\nWith({\n    LarguraTable:Substitute(Largura,\"px\",\"\") -20,\n    AlturaTable:Substitute(Altura,\"px\",\"\") -20,\n    NotaDesempenho:Sum(colMetasAvaliacaoColaboradores,Peso*Resposta/100),\n    NotaPotencial:Average(colAvaliacoesColaboradoresRespostas,RespostaCalibrada)\n    },\nWith({\n    PosicaoXLinha:Substitute(NotaDesempenho/NotaMaxima*(LarguraTable-20),\",\",\".\"),\n    PosicaoYLinha:Substitute((NotaMaxima-NotaPotencial)/NotaMaxima*(AlturaTable-20),\",\",\".\")\n    },\n\n\"\n<div style='width: 100%; height: 100%;display: flex;justify-content: center;'>\n<div style='display: flex; flex-direction: column; width: \"&Largura&\"; height: \"&Altura&\";'>\n    <div style='flex-grow: 1; background-color: transparent; display: flex; justify-content: center; align-items: center; color: white;'>\n        <div style='display: flex; width: 100%; height: 100%;'>\n            <div style='flex: 0 0 20px;  background-color: \"&CorFundo&\";border-right: \"&LinhaEspessura & \" \"&LinhaTipo&\" \"&LinhaCor&\"; display: flex; justify-content: center; align-items: center; flex-direction: column;margin-bottom: -20px'><!-- DIV DA ESQUERDA -->\n                <span style='writing-mode: vertical-lr; transform: rotate(180deg); color: \"&CorTexto&\"; font-weight: bold;'>\"&TextoEixoY&\"</span>\n            </div>\n            <div style='position: relative;background-color: white; display: flex; justify-content: left; align-items: center;'><!-- DIV DA DIREITA -->\n                <table style='width: \"&LarguraTable&\"px; background-color: transparent;  table-layout: fixed; height: \"&AlturaTable&\"px; border-collapse: separate; border-spacing: \"&If(LinhaHorizontal || LinhaVertical,\"0px\", EspacamentoQuadrantes)&\"; text-align: center;'>\n                    <colgroup>\n                        <col style='width: calc((100% - 20px) / 3);'> <!-- Dividindo o restante por três -->\n                        <col style='width: calc((100% - 20px) / 3);'>\n                        <col style='width: calc((100% - 20px) / 3);'>\n                    </colgroup>\n                    <tr>\n                        <td style='border: none; width: 20px;color: black;writing-mode: vertical-lr; transform: rotate(-180deg);'>\"&Y3&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X3Y1.CorFundo&\"; color: \"&X3Y1.CorTexto&\";height: 33%;'>\"&X3Y1.Texto&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X3Y2.CorFundo&\"; color: \"&X3Y2.CorTexto&\";height: 33%;'>\"&X3Y2.Texto&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X3Y3.CorFundo&\"; color: \"&X3Y3.CorTexto&\";height: 33%;'>\"&X3Y3.Texto&\"</td>\n                    </tr>\n                    <tr>\n                        <td style='border: none; width: 20px;color: black;writing-mode: vertical-lr; transform: rotate(-180deg);'>\"&Y2&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X2Y1.CorFundo&\"; color: \"&X2Y1.CorTexto&\";height: 33%;'>\"&X2Y1.Texto&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X2Y2.CorFundo&\"; color: \"&X2Y2.CorTexto&\";height: 33%;'>\"&X2Y2.Texto&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X2Y3.CorFundo&\"; color: \"&X2Y3.CorTexto&\";height: 33%;'>\"&X2Y3.Texto&\"</td>\n                    </tr>\n                    <tr>\n                        <td style='border: none; width: 20px;color: black;writing-mode: vertical-lr; transform: rotate(-180deg);'>\"&Y1&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X1Y1.CorFundo&\"; color: \"&X1Y1.CorTexto&\";height: 33%;'>\"&X1Y1.Texto&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X1Y2.CorFundo&\"; color: \"&X1Y2.CorTexto&\";height: 33%;'>\"&X1Y2.Texto&\"</td>\n                        <td style='\"&Estilo&\" background-color: \"&X1Y3.CorFundo&\"; color: \"&X1Y3.CorTexto&\";height: 33%;'>\"&X1Y3.Texto&\"</td>\n                    </tr>\n                    <tr>\n                        <td style='border: none;'></td>\n                        <td style='border: none;color: black;'>\"&X1&\"</td>\n                        <td style='border: none;color: black;'>\"&X2&\"</td>\n                        <td style='border: none;color: black;'>\"&X3&\"</td>\n                    </tr>\n                </table>\" &\n                If(LinhaVertical,\n                \n                \"<!-- Linha Vertical Pontilhada -->\n                <div style=\"\"position: absolute;margin-left:20px; left: \"&PosicaoXLinha&\"px; width: 0; height: 100%; \"&EstiloLinhaVertical&\";\"\"></div>\"\n                ) &\n\n                If(LinhaHorizontal,\n        \n                \"<!-- Linha Horizontal Pontilhada -->\n                <div style=\"\"position: absolute;margin-top:2px; top: \"&PosicaoYLinha&\"px; height: 0; width: 100%; \"&EstiloLinhaHorizontal&\";\"\"></div>\"\n                ) &\n                \n            \"</div>\n        </div>\n    </div>\n    <div style='flex: 0 0 20px; background-color: \"&CorFundo&\";border-top: \"&LinhaEspessura&\" \"&LinhaTipo&\" \"&LinhaCor&\"; display: flex; justify-content: center; align-items: center;margin-left: 0px;'>\n        <span style='color: \"&CorTexto&\"; font-weight: bold;'>\"&TextoEixoX&\"</span>\n    </div>\n</div>\n</div>\"\n)))"
            Size: =8
            Visible: =false
            Width: =215
            X: =24
            Y: =252
